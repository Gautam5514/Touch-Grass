# Render Blueprint: static site. No server code runs; photos and AI stay in the browser.
services:
  - type: web
    name: wildquest-ai
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    routes:
      # Adventure ids exist only at runtime (IndexedDB), so one static shell serves
      # /adventure/<id>/ and /adventure/<id>/complete/. Real files still win over rewrites.
      - type: rewrite
        source: /adventure/*
        destination: /adventure/index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /ort/*
        name: Cache-Control
        value: public, max-age=86400
